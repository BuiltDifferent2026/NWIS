# DDR Template Mapping Configuration
# Label aliases, section detection keywords, and extraction rules

sections:
  - id: "well_context"
    name: "Well Context & Header"
    color: "blue"
    keywords: ["basin", "rig", "location", "well", "target", "present depth", "installation manager"]
  - id: "casing_details"
    name: "Casing Details"
    color: "cyan"
    keywords: ["casing details", "size (inch)", "casing type", "shoe at", "fc at"]
  - id: "operation_details"
    name: "Operation Details"
    color: "yellow"
    keywords: ["operation details"]
  - id: "bit_bha"
    name: "Bit & BHA Details"
    color: "teal"
    keywords: ["bit details", "bit srl no", "type & nozzle", "make/iadc", "bha length", "bha weight"]
  - id: "mud_parameters"
    name: "Mud Parameters"
    color: "purple"
    keywords: ["mud parameters", "mud wt", "viscosity", "pv/yp", "fluid loss", "ph", "salinity"]
  - id: "formation_data"
    name: "Formation Data"
    color: "green"
    keywords: ["formation top", "formation drilled"]
  - id: "bit_hydraulics"
    name: "Bit Hydraulics"
    color: "indigo"
    keywords: ["bit hydraulics", "hhp", "jet velocity", "bit efficiency", "annular velocity"]
  - id: "drilling_parameters"
    name: "Drilling Parameters"
    color: "orange"
    keywords: ["drilling parameters", "wob", "torque", "rpm", "gpm", "spp"]
  - id: "time_lost_npt"
    name: "Time Lost & NPT"
    color: "red"
    keywords: ["time lost due to shut down", "hrs lost", "reason", "time b/up", "npt in 24 hrs", "operating time", "repairing time"]
  - id: "narrative_remarks"
    name: "Next Operation & Remarks"
    color: "amber"
    keywords: ["next operation", "remarks", "pre spud inspection"]

fields:
  # Source / Header
  report_date:
    aliases: ["operation date", "report date", "date of operation", "date"]
    expected_unit: "date"
    direction: "right"
    section: "well_context"
    confidence: "STRUCTURED_HIGH"

  # Well Context
  well_id:
    aliases: ["well", "well no", "well name", "well:"]
