name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (GitHub Actions minimum is 5 minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping /health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render backend /health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "${{ secrets.RENDER_BACKEND_URL }}/health"

      - name: Report success
        if: success()
        run: echo "✅ Backend is alive and healthy."

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Backend health check failed — Render may be spinning up or unreachable."
          exit 1
