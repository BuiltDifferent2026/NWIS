name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes with off-minute offset (:03, :13, :23, :33, :43, :53 UTC)
    # Off-minute schedules avoid the massive GitHub queue congestion at :00, :10, :20, :30
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Render Backend URL (Optional override; defaults to RENDER_BACKEND_URL secret or variable)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  ping:
    name: Ping /health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping Render Backend Health Check
        run: |
          RAW_URL="${{ inputs.backend_url || secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL }}"

          # Check if URL was supplied
          if [ -z "$RAW_URL" ]; then
            echo "::error::RENDER_BACKEND_URL is not set!"
            echo ""
            echo "👉 How to configure it:"
            echo "1. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Under 'Repository secrets' (or 'Variables'), click 'New repository secret'"
            echo "3. Name: RENDER_BACKEND_URL"
            echo "4. Value: https://your-backend-service.onrender.com (replace with your Render backend URL)"
            echo ""
            echo "Alternatively, you can provide the URL in the 'Run workflow' dialog inputs when triggering manually."
            exit 1
          fi

          # Clean whitespace and strip trailing slashes
          CLEAN_URL="$(echo "$RAW_URL" | tr -d '[:space:]')"
          CLEAN_URL="${CLEAN_URL%/}"

          # Ensure https protocol is present
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://${CLEAN_URL}"
          fi

          TARGET_ENDPOINT="${CLEAN_URL}/health"
          echo "Target Health Endpoint: $TARGET_ENDPOINT"
          echo "Sending ping to prevent Render spindown..."

          # Curl with cold-start tolerance (Render free instances take 40-50s to wake up)
          HTTP_RESPONSE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "$TARGET_ENDPOINT") || CURL_EXIT=$?

          echo "Response:"
          echo "$HTTP_RESPONSE"

          # Extract status code
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          if [ "$STATUS_CODE" = "200" ]; then
            echo ""
            echo "✅ Render backend is active and healthy (HTTP 200)!"
          else
            echo ""
            echo "::error::Health check returned HTTP $STATUS_CODE (expected 200)."
            exit 1
          fi
